<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF6E8" />
    <meta name="description" content="Move into a new neighborhood. Learn your first words, meet your neighbors, and play through Wayword’s language-learning story." />
    <link rel="preload" href="%BASE_URL%assets/audio/footstep.mp3" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%assets/audio/key_jingle.mp3" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%assets/audio/bump_oops.mp3" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%assets/audio/bump_ouch.mp3" as="fetch" crossorigin />
    <link rel="preload" href="%BASE_URL%assets/audio/ne/namaste.wav" as="fetch" crossorigin />
    <title>Wayword · Your neighborhood story</title>
    <style>
      html,body{margin:0;background:#fff6e8}
      #lesson-opening{position:fixed;inset:0;z-index:1000;display:grid;place-content:center;justify-items:center;gap:16px;background:#fff6e8;color:#2b2340;font:600 15px/1.5 system-ui,sans-serif;transition:opacity .18s ease;pointer-events:none}
      #lesson-opening span{display:grid;place-items:center;width:58px;height:58px;border-radius:20px;background:#207d7e;color:#fff;font-size:30px;font-weight:800;box-shadow:inset 0 2px 0 #ffffff50,0 4px 0 #145454;animation:quest-breathe 1.2s ease-in-out infinite}
      #lesson-opening p{margin:0}
      #lesson-opening.is-ready{opacity:0}
      @keyframes quest-breathe{50%{transform:translateY(-4px)}}
      @media(prefers-reduced-motion:reduce){#lesson-opening{transition:none}#lesson-opening span{animation:none}}
    </style>
  </head>
  <body>
    <div id="lesson-opening" role="status"><span aria-hidden="true">w</span><p>Opening your quest…</p></div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
